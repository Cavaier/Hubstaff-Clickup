name = "hubstaff-clickup-sync"
main = "src/worker.js"
compatibility_date = "2026-10-05"

# Every minute. Free plan allows cron triggers; a tick is one request, so this
# uses 1,440 of the 100,000/day request budget.
[triggers]
crons = ["* * * * *"]

# State lives in D1, not KV. KV has no compare-and-set, so the read -> post -> write
# it required was a lost update: two concurrent cron invocations both read before
# either wrote and both posted. D1's PRIMARY KEY makes the claim atomic.
# Create with:  wrangler d1 create hubstaff-clickup
[[d1_databases]]
binding = "DB"
database_name = "hubstaff-clickup"
database_id = "d318b9f8-f50d-4c55-8101-5d5dcaa1af71"

# Kept only so the first run can carry the already-posted ids out of KV and into
# D1. Safe to delete this binding and the namespace once /health reports
# "bootstrapped".
[[kv_namespaces]]
binding = "SYNC_STATE"
id = "28b9f11ee3074598b1cdf9b1e621a150"

# Secrets are NOT set here - they would end up in git. Set them with:
#   wrangler secret put HUBSTAFF_PERSONAL_ACCESS_TOKEN
#   wrangler secret put CLICKUP_API_TOKEN
#   wrangler secret put TRIGGER_TOKEN        # optional, enables POST /run and /webhook/register
#   wrangler secret put WEBHOOK_KEY          # optional, enables the Hubstaff webhook
