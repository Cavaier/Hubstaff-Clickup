name: Hubstaff clock in/out to ClickUp

on:
  # No `schedule:` trigger here - GitHub's native cron never reliably fired for this
  # workflow (see commit history). An external cron-job.org job now calls workflow_dispatch
  # directly via the GitHub API on its own schedule instead.
  workflow_dispatch: {}

# DO NOT add a `concurrency:` group here. It was tried and it broke the sync.
#
# cron-job.org dispatches this every minute. A concurrency group lets GitHub hold only
# one pending run, so as soon as acquiring a runner takes longer than the dispatch
# interval - which it does under GitHub-side contention; one run sat queued for 15
# minutes - every new dispatch cancels the previous pending one and essentially nothing
# completes. It is self-sustaining once the queue backs up.
#
# Without it two runs can overlap and, if both read state before either writes, post the
# same event twice. That window is a few seconds against a 60s interval, and a duplicate
# message is far cheaper than a dead sync. Proper atomic claim-before-post needs a real
# compare-and-set store, not a git branch.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # State lives on the orphan `state` branch rather than in the Actions cache.
      # Cache entries are branch-scoped and evicted after 7 days, and a cache miss used
      # to fall back to "the last 10 minutes" silently, skipping every event older than
      # that. A missing branch here is loud and makes the script seed instead of post.
      #
      # The file holds nothing but opaque Hubstaff event ids - no names, no timestamps,
      # no member ids - so it is safe to keep in a public repo.
      - name: Restore state
        run: |
          mkdir -p state
          if git fetch --depth=1 origin state 2>/dev/null \
             && git show FETCH_HEAD:hubstaff_clickup_state.json > state/hubstaff_clickup_state.json 2>/dev/null; then
            echo "state restored ($(wc -c < state/hubstaff_clickup_state.json) bytes)"
          else
            rm -f state/hubstaff_clickup_state.json
            echo "no usable state branch - this run will seed one and post nothing"
          fi

      - name: Run sync
        env:
          HUBSTAFF_PERSONAL_ACCESS_TOKEN: ${{ secrets.HUBSTAFF_PERSONAL_ACCESS_TOKEN }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: python3 scripts/hubstaff_clickup_sync.py

      # Runs even when the sync step failed: the script saves the ids it did post before
      # exiting non-zero, and losing those would mean re-posting them next run.
      - name: Persist state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f state/hubstaff_clickup_state.json ] || { echo "nothing to persist"; exit 0; }
          work="$(mktemp -d)"
          cp state/hubstaff_clickup_state.json "$work/hubstaff_clickup_state.json"
          cd "$work"
          git init -q
          git checkout -q -b state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hubstaff_clickup_state.json
          git commit -q -m "Update sync state"
          # Force-pushed as a fresh single-commit orphan branch each run, so the branch
          # never accumulates history. Safe because `concurrency` serialises runs and
          # nothing else writes it.
          if ! git push -q --force \
               "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state; then
            echo "::error::Could not push the state branch. Check Settings > Actions > General >" \
                 "Workflow permissions is set to 'Read and write permissions' - a repo set to" \
                 "read-only overrides this workflow's 'contents: write'."
            exit 1
          fi
